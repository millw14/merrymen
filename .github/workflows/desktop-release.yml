name: Desktop release

# Push a tag like `desktop-v0.1.0` and this builds the installers on GitHub's own
# runners and publishes them to a Release. Also downloadable as
# run artifacts (Actions → the run → Artifacts) even before the release is cut.
# Or trigger manually from the Actions tab (workflow_dispatch).
#
# Linux-only for now: Windows/macOS stay out of the matrix until they can be
# tested on real hardware. Re-add them when ready.
on:
  push:
    tags:
      - "desktop-v*"
      - "desktop-beta-v*"
  workflow_dispatch: {}

permissions:
  contents: write # create the Release + upload assets (uses the built-in token)

jobs:
  build:
    strategy:
      fail-fast: false # one OS failing shouldn't cancel the other
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changelog step needs tag history to diff against

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Root install runs the `prepare` hook, which builds the dashboard (web/.next).
      - name: Install root deps + build dashboard
        shell: bash
        run: npm install

      # Pack merrymen into a tarball (with the prebuilt dashboard + worker) so the
      # desktop app installs a REAL COPY of it — not a `file:` symlink, which a
      # fresh CI npm may create and which electron-builder (asar off) chokes on.
      - name: Pack merrymen (symlink-free copy)
        shell: bash
        run: npm pack

      - name: Install desktop deps
        shell: bash
        working-directory: desktop
        run: |
          npm install                      # electron + electron-builder + deps
          npm install ../merrymen-*.tgz    # replace file:.. with the packed copy

      # Gate: a bundle that can't resolve its sentinels must fail the run,
      # not ship as a release. Mirrors the app's own boot check in main.js.
      - name: Verify staged bundle resolves
        shell: bash
        working-directory: desktop
        run: |
          node -e "const path = require('path');
            const roots = [process.cwd(), path.join(process.cwd(), 'node_modules', 'merrymen')];
            for (const r of ['merrymen/package.json', '@next/env', '@esbuild/linux-x64/package.json', 'tsx/package.json'])
              if (!roots.some((root) => { try { require.resolve(r, { paths: [root] }); return true; } catch { return false; } })) throw new Error('unresolvable: ' + r);"
          test -f node_modules/merrymen/worker/src/index.ts
          test -f loading.html
          echo "bundle resolves"

      - name: Build the installer for this OS
        shell: bash
        working-directory: desktop
        run: npx --no-install electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing certs → skip auto-discovery so the mac build doesn't fail
          # trying to sign. (Add CSC_LINK/CSC_KEY_PASSWORD later to sign.)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Always available: download the .AppImage from the run itself.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merrymen-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            desktop/dist/*.AppImage
            desktop/dist/latest-linux.yml
            desktop/build/icon.png

      # Stable (`desktop-v*`) ships as a full release; beta tags
      # (`desktop-beta-v*`) ship as prereleases so only beta-channel apps
      # (in-app toggle → allowPrerelease) are offered them.
      # Titles follow the maintainer style ("Desktop 0.1.7"), derived from
      # the tag instead of echoing it raw.
      # Changelog: desktop-scoped commit subjects since the previous desktop-*
      # tag, so every release note lists what actually changed. Unscoped the
      # range drowns in unrelated mainline history (600+ commits); the desktop
      # release only names what it ships. A commit appears if it touches any
      # of these paths — so a change spanning cli/ + desktop/ still shows.
      # web/src/terminal is in scope because the desktop bundles the dashboard:
      # a terminal layout fix ships in the AppImage. Broader web/ is not — it
      # would drown the notes in non-desktop web history.
      # First tag (or a rebuild with no new commits) falls back to an explicit
      # line, never blank-mysterious.
      - name: Build changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          REF="${{ github.ref }}"
          PREV="$(git tag --list 'desktop-*' --sort=-creatordate | grep -v "${REF#refs/tags/}" | head -n 1)"
          SCOPE="desktop web/src/terminal .github/workflows/desktop-release.yml .github/workflows/desktop-dev.yml"
          {
            echo "PREV_TAG=$PREV"
            echo "CHANGELOG<<EOF"
            if [ -n "$PREV" ] && [ -n "$(git log --oneline "$PREV..HEAD" -- $SCOPE 2>/dev/null)" ]; then
              git log --format='- %s (%h)' "$PREV..HEAD" -- $SCOPE
            else
              echo "(rebuild — no desktop changes since ${PREV:-the beginning})"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set channel (stable vs beta)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/desktop-beta-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
            echo "CHANNEL_LINE=**Channel:** beta — offered only to apps with the beta toggle on." >> "$GITHUB_ENV"
            echo "DISPLAY_NAME=Desktop ${REF#refs/tags/desktop-beta-v}" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
            echo "CHANNEL_LINE=**Channel:** stable." >> "$GITHUB_ENV"
            echo "DISPLAY_NAME=Desktop ${REF#refs/tags/desktop-v}" >> "$GITHUB_ENV"
          fi

      # On a tag: attach the installers to a public GitHub Release.
      - name: Publish to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.DISPLAY_NAME }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
          fail_on_unmatched_files: false
          body: |
            **merrymen desktop** — the one-click app. Double-click to install; no terminal, no Node.

            ${{ env.CHANNEL_LINE }}

            ### What's changed
            ${{ env.CHANGELOG }}

            - **Linux:** download the `.AppImage`, make it executable (`chmod +x`), and run it.
              It needs FUSE to mount — Ubuntu 22.04+: `sudo apt install libfuse2`;
              Arch: `sudo pacman -S fuse2`.
            - **Windows/macOS:** not built in this release — coming once they can be
              tested on real hardware.

            Shares its home (`~/.merrymen`) with the `npm i -g merrymen` CLI.
          files: |
            desktop/dist/*.AppImage
            desktop/dist/latest-linux.yml
            desktop/build/icon.png
