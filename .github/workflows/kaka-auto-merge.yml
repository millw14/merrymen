name: Kaka auto merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaka-auto-merge
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main' && vars.KAKA_AUTO_MERGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: write
    steps:
      # github.sha is main for these events. Never execute a PR checkout here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            await require('./.github/kaka/gate.cjs').run({ github, context, core });
