<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening merrymen</title>
  <style>
    :root {color-scheme:dark;}
    * {box-sizing:border-box;}
    body {margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#080905;color:#e9e9e1;font-family:system-ui,-apple-system,sans-serif;}
    main {width:100%;max-width:440px;}
    .brand {font-size:23px;font-weight:600;letter-spacing:-.04em;}
    h1 {font-size:30px;line-height:1.15;letter-spacing:-.04em;margin:28px 0 16px;font-weight:600;}
    p {font-size:15px;line-height:1.7;color:#92958a;margin:0;}
    .bar {margin-top:24px;height:3px;border-radius:3px;background:#272920;overflow:hidden;}
    .bar i {display:block;height:100%;width:35%;background:#e9e9e1;animation:slide 1.5s ease-in-out infinite;}
    @keyframes slide {from{transform:translateX(-100%)}to{transform:translateX(390%)}}
    @media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%;opacity:.5;}}
  </style>
</head>
<body><main><div class="brand">merrymen</div><div role="status"><h1>Opening your workspace.</h1><p>Connecting to your local app…</p></div><div class="bar" aria-hidden="true"><i></i></div></main></body>
</html>
