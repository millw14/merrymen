[profile.default]
src = "contracts/contracts"
out = "contracts/out"
libs = ["lib", "contracts/lib"]
test = "contracts/test/foundry"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

remappings = [
    "src/=contracts/contracts/"
]

[fuzz]
runs = 10000
max_test_rejects = 100000

[invariant]
runs = 256
depth = 100
call_override = false
