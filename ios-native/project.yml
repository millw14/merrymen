name: Merrymen
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
packages:
  Privy:
    url: https://github.com/privy-io/privy-ios
    exactVersion: 2.16.2
  MerrymenPolicy:
    path: Policy
  Reown:
    url: https://github.com/reown-com/reown-swift
    exactVersion: 2.4.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    PRIVY_APP_ID: cmtnun9wn00rg0dl5txyoxpju
    PRIVY_CLIENT_ID: ""
    WALLETCONNECT_PROJECT_ID: ""
targets:
  Merrymen:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes: [Info.plist]
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: merrymen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: dev.merrymen.app
            CFBundleURLSchemes: [merrymen]
        NSCameraUsageDescription: Take a photo for your Merrymen agent avatar or banner.
        NSPhotoLibraryUsageDescription: Choose a photo for your Merrymen agent avatar or banner.
        NSMicrophoneUsageDescription: Dictate an editable message to your agent. Recording starts only when you tap the microphone.
        NSSpeechRecognitionUsageDescription: Transcribe your voice on this device into a draft you review before sending.
        PrivyAppID: $(PRIVY_APP_ID)
        PrivyClientID: $(PRIVY_CLIENT_ID)
        WalletConnectProjectID: $(WALLETCONNECT_PROJECT_ID)
        WalletConnectKeychainGroup: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        LSApplicationQueriesSchemes: [metamask, rainbow, trust, zerion, argent, safe, phantom, wc]
        UIAppFonts: [DMSans.ttf, GeistPixel.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.merrymen.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: MerrymenPolicy
      - package: Privy
        product: Privy
      - package: Reown
        product: ReownAppKit
  MerrymenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.merrymen.app.uitests
    dependencies:
      - target: Merrymen
  MerrymenAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.merrymen.app.tests
    dependencies:
      - target: Merrymen
schemes:
  Merrymen:
    build:
      targets:
        Merrymen: all
    test:
      targets: [MerrymenAppTests, MerrymenUITests]
