name: Merrymen
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
packages:
  Privy:
    url: https://github.com/privy-io/privy-ios
    exactVersion: 2.16.2
  MerrymenPolicy:
    path: Policy
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    PRIVY_APP_ID: cmtnun9wn00rg0dl5txyoxpju
    PRIVY_CLIENT_ID: ""
targets:
  Merrymen:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [Resources]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: merrymen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: dev.merrymen.app
            CFBundleURLSchemes: [merrymen]
        NSCameraUsageDescription: Take a photo for your Merrymen agent avatar or banner.
        NSPhotoLibraryUsageDescription: Choose a photo for your Merrymen agent avatar or banner.
        PrivyAppID: $(PRIVY_APP_ID)
        PrivyClientID: $(PRIVY_CLIENT_ID)
        UIAppFonts: [DMSans.ttf, GeistPixel.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.merrymen.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: MerrymenPolicy
      - package: Privy
        product: Privy
  MerrymenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.merrymen.app.uitests
    dependencies:
      - target: Merrymen
schemes:
  Merrymen:
    build:
      targets:
        Merrymen: all
    test:
      targets: [MerrymenUITests]
